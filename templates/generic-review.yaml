# SCI-writer Domain Configuration Template v1.0
# Fill in the fields below for your research domain.
# Save as: domain-config.yaml in your project directory.

paper:
  title: "YOUR PAPER TITLE HERE"
  short_title: "Short Title"
  journal: "Target Journal Name"
  impact_factor: 0.0  # e.g., 12.6
  type: "review"  # review | systematic_review | meta_analysis
  word_target: 12000
  reference_target: 180
  figures_target: 8
  tables_target: 4

domain:
  field: "your research field name"
  unifying_framework: "your_framework_name"  # e.g., measurement_instrument_chain
  framework_description: >
    Describe the single cognitive model that organizes the entire paper.
    This framework should be simple enough for newcomers, precise enough for experts.
  keywords:
    primary:
      - "keyword1"
      - "keyword2"
      - "keyword3"
    secondary:
      - "keyword4"
      - "keyword5"

  key_researchers:
    - "Researcher Name (Institution) — research focus"
    # Add 10-20 key researchers in the field

  detection_method_taxonomy:
    # Define the detection methods used in your field
    # Example:
    # electrochemical:
    #   - amperometry
    #   - EIS
    # optical:
    #   - fluorescence
    category1:
      - method1
      - method2
    category2:
      - method3

  performance_metrics:
    - {name: "Metric 1", unit: "unit", good_threshold: "value", excellent: "value"}
    - {name: "Metric 2", unit: "unit", good_threshold: "value"}

  search_clusters:
    - name: "Cluster A: Core Technology"
      queries:
        - "search query 1"
        - "search query 2"
    - name: "Cluster B: Applications"
      queries:
        - "search query 3"
    - name: "Cluster C: System Integration"
      queries:
        - "search query 4"
    - name: "Cluster D: Foundational & Tutorial"
      queries:
        - "search query 5"
      purpose: "Papers that explain core concepts accessibly"
    - name: "Cluster E: Chinese Literature"
      queries:
        - "search query 6"
      databases: ["CNKI", "Wanfang", "PubMed (Chinese affiliation filter)"]

  journals_to_monitor:
    - "Journal Name 1"
    - "Journal Name 2"
    - "Journal Name 3"

  technology_milestones:
    - {year: 2000, event: "First demonstration of key technology", significance: "founding"}
    - {year: 2010, event: "Major breakthrough", significance: "enabling"}
    - {year: 2020, event: "Integration milestone", significance: "integration"}
    - {year: 2026, event: "Current state", significance: "current"}

  decision_flowcharts:
    - section: "§2.5"
      title: "Technology Selection Guide"
      inputs: ["input1", "input2"]
      outputs: ["output1", "output2"]
      format: "flowchart figure"

  open_questions:
    - {id: 1, question: "Open question 1?", priority: "high", difficulty: "domain"}
    - {id: 2, question: "Open question 2?", priority: "medium", difficulty: "domain"}
    - {id: 3, question: "Open question 3?", priority: "low", difficulty: "domain"}

review:
  existing_reviews_to_beat:
    - "Author Year Journal — scope description, what it covers, what it misses"

  unique_contribution: >
    Describe what makes THIS review unique. What is it the FIRST to cover?
    What framework does it use that others don't?

outline:
  sections:
    - number: "1"
      title: "Introduction"
      word_target: 2500
      subsections:
        - "1.1 Motivation and clinical/societal need"
        - "1.2 Technology history timeline"
        - "1.3 Unifying framework (★ central cognitive model)"
        - "1.4 Scope, organization, and unique contribution"
      figures: ["Fig. 1: Timeline", "Fig. 2: Framework diagram"]

    - number: "2"
      title: "Foundation Layer"
      word_target: 3000
      subsections:
        - "2.1 Topic A"
        - "2.2 Topic B"
        - "2.3 Topic C"
        - "2.4 Design decision guide (★ flowchart)"

    - number: "3"
      title: "Functional Layer"
      word_target: 3000
      subsections:
        - "3.1 Fundamentals"
        - "3.2 Modality A"
        - "3.3 Modality B"
        - "3.4 Modality selection matrix (★ comparison table)"

    - number: "4"
      title: "Application Layer"
      word_target: 2500
      subsections:
        - "4.1 Application domain A"
        - "4.2 Application domain B"

    - number: "5"
      title: "System Integration"
      word_target: 3000
      subsections:
        - "5.1 Signal chain overview"
        - "5.2 Component A"
        - "5.3 Component B"
        - "5.4 Wireless and power"

    - number: "6"
      title: "Intelligence Layer"
      word_target: 2500
      subsections:
        - "6.1 Signal processing"
        - "6.2 Calibration"
        - "6.3 Edge AI"
        - "6.4 Case studies"

    - number: "7"
      title: "Challenges & Future"
      word_target: 2500
      subsections:
        - "7.1 Open challenges"
        - "7.2 Commercialization"
        - "7.3 Emerging directions"
        - "7.4 Open questions (★ research guide)"

    - number: "8"
      title: "Conclusion"
      word_target: 500
      key_takeaways: 3

journal_requirements:
  abstract_max_words: 300
  highlights_required: true
  highlights_count: 5
  highlights_max_chars: 85
  graphical_abstract_required: true
  graphical_abstract_size: "400x300 px"
  template: "elsarticle"
  citation_style: "numbered"
  cover_letter_required: true
