review:
  existing_reviews_to_beat:
    - "Sekar 2023 Adv Mater — fabrication focus, minimal embedded systems/AI"
    - "Yang 2022 Chem Soc Rev — electrochemistry fundamentals, not wearable integration"
    - "Teymourian 2021 ACS Nano — strong wearable patch coverage, weak on microneedle specifics"
    - "Zhao 2023 Biosens Bioelectron — microneedle diabetes focus, narrow scope"
    - "Li 2024 Adv Sci — wearable biosensor review, limited microneedle+terminal integration"
    - "Kim 2023 ACS Nano — microneedle drug delivery/sensing dual function"
    - "Zhang 2024 Chem Eng J — 3D printed microneedle, no system integration"

  unique_contribution: >
    This is the FIRST comprehensive review to adopt a measurement instrument chain
    framework, treating wearable microneedle-based electrochemical sensing as a
    complete engineering system — from material design and electrochemical transduction
    through signal conditioning circuits to embedded intelligent terminals — and
    providing systematic decision guides (material × geometry × sensing modality)
    that enable readers to independently design and evaluate microneedle sensing systems.

outline:
  sections:
    - number: "1"
      title: "Introduction"
      word_target: 2500
      subsections:
        - "1.1 Clinical motivation: from finger-prick to continuous monitoring"
        - "1.2 Technology history: key milestones 2000→2026 (timeline figure)"
        - "1.3 Measurement instrument chain framework (★ central cognitive model)"
        - "1.4 Scope, organization, and unique contribution"
      figures: ["Fig. 1: Technology history timeline", "Fig. 2: Measurement chain framework diagram"]
      pedagogical_role: "Establish the cognitive map that readers use throughout the paper"

    - number: "2"
      title: "Microneedle Fabrication & Materials Engineering"
      word_target: 3000
      subsections:
        - "2.1 Substrate materials: Si, metals, polymers, carbon, hydrogels (5-class comparison)"
        - "2.2 Geometric configurations: solid, hollow, porous, dissolving, coated"
        - "2.3 Electrode functionalization: enzyme immobilization, nanostructuring, biorecognition"
        - "2.4 Fabrication processes: etching, molding, 3D printing, electrodeposition"
        - "2.5 Design decision guide: material × geometry × process selection (★ flowchart)"
      figures: ["Fig. 3: Material taxonomy", "Fig. 4: Design decision flowchart"]
      tables: ["Table 1: Material properties comparison matrix"]
      pedagogical_role: "After reading, reader can answer: 'If I build a glucose MNA, what material and geometry?'"

    - number: "3"
      title: "Electrochemical Sensing Principles & Modalities"
      word_target: 3000
      subsections:
        - "3.1 Electrochemical measurement fundamentals (accessible introduction)"
        - "3.2 Amperometry: enzyme-catalyzed current → glucose/lactate"
        - "3.3 Voltammetry: CV, DPV, SWV, FSCV → multi-analyte"
        - "3.4 Impedance spectroscopy: label-free immunosensing"
        - "3.5 Potentiometry: ion-selective electrodes → Na⁺/K⁺/pH"
        - "3.6 Modality selection guide: analyte × LOD × selectivity × power (★ matrix)"
      figures: ["Fig. 5: Sensing modality comparison radar chart"]
      tables: ["Table 2: Quantitative performance comparison across all modalities"]
      pedagogical_role: "After reading, reader can explain why amperometry suits glucose but EIS suits cortisol"

    - number: "4"
      title: "Target Biomarkers & Clinical Applications"
      word_target: 2500
      subsections:
        - "4.1 Metabolic markers: glucose, lactate, uric acid, creatinine"
        - "4.2 Electrolytes: Na⁺, K⁺, Ca²⁺, pH"
        - "4.3 Stress & immune: cortisol, cytokines"
        - "4.4 Neurotransmitters: dopamine, serotonin"
        - "4.5 Therapeutic drug monitoring"
        - "4.6 Multiplexed detection: array design and orthogonality"
      tables: ["Table 3: Biomarker clinical significance and current detection status"]
      pedagogical_role: "Reader understands what we measure and why each biomarker matters clinically"

    - number: "5"
      title: "Signal Chain & System Integration"
      word_target: 3000
      subsections:
        - "5.1 Signal chain overview: needle-skin → AFE → digital output (★ block diagram)"
        - "5.2 Needle-skin interface: ISF sampling kinetics, interfacial impedance"
        - "5.3 Analog front-end: potentiostat, low-noise amplifier, ADC"
        - "5.4 Flexible substrate & skin-conformal design"
        - "5.5 Wireless communication: BLE, NFC, LoRa protocol selection"
        - "5.6 Power management: battery, energy harvesting, power budget"
      figures: ["Fig. 6: Complete signal chain block diagram", "Fig. 7: Flexible substrate examples"]
      tables: ["Table 4: System integration approaches comparison"]
      pedagogical_role: "Unique instrument science perspective — reader sees the ENTIRE signal chain as one system"

    - number: "6"
      title: "Embedded Intelligence & Data Processing"
      word_target: 2500
      subsections:
        - "6.1 Signal preprocessing: filtering, baseline correction, drift compensation"
        - "6.2 Calibration: factory, in-situ, personalized ML"
        - "6.3 Edge AI: anomaly detection, trend prediction, closed-loop control"
        - "6.4 Cloud connectivity and digital health ecosystem"
        - "6.5 End-to-end system teardowns: 3 representative systems deep-dived (★ case studies)"
      figures: ["Fig. 8: Edge AI processing pipeline"]
      tables: ["Table 5: End-to-end system teardown comparison"]
      pedagogical_role: "Reader sees how real systems work from signal to insight; 3 case studies make it concrete"

    - number: "7"
      title: "Challenges, Commercialization & Future Perspectives"
      word_target: 2500
      subsections:
        - "7.1 Biofouling and long-term stability"
        - "7.2 ISF-blood lag and calibration accuracy"
        - "7.3 Commercialization landscape: products, patents, market analysis"
        - "7.4 Regulatory pathways: FDA 510(k), CE, NMPA"
        - "7.5 Emerging directions: closed-loop therapy, multi-modal, autonomous AI"
